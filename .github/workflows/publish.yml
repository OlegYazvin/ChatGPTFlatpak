name: Build and publish Flatpak prerelease

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: flatpak-publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gnupg python3
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build packaging
        run: ./scripts/build.sh --user --install-deps-from=flathub
      - name: Validate actual extra-data installation
        run: |
          flatpak install --user --noninteractive -y ./repo io.github.OlegYazvin.ChatGPTFlatpak
          flatpak run --command=/app/extra/chatgpt/resources/codex io.github.OlegYazvin.ChatGPTFlatpak --version
      - name: Import dedicated signing key
        env:
          PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ vars.FLATPAK_GPG_KEY_ID }}
        run: |
          test -n "$PRIVATE_KEY"
          test -n "$FLATPAK_GPG_KEY_ID"
          mkdir -p "$RUNNER_TEMP/signing"
          chmod 700 "$RUNNER_TEMP/signing"
          printf '%s\n' "$PRIVATE_KEY" | gpg --homedir "$RUNNER_TEMP/signing" --batch --import
          gpg --homedir "$RUNNER_TEMP/signing" --export "$FLATPAK_GPG_KEY_ID" > "$RUNNER_TEMP/public-key.gpg"
          cmp packaging/repo-public-key.gpg "$RUNNER_TEMP/public-key.gpg"
      - name: Sign repository and prepare installer
        env:
          FLATPAK_GPG_KEY_ID: ${{ vars.FLATPAK_GPG_KEY_ID }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/signing"
          ./scripts/sign.sh
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages repository
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy signed repository
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            tag="v$(python3 -c 'import json; print(json.load(open("packaging/payload.json"))["version"])')-1"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" site/ChatGPT.flatpakref site/ChatGPT.flatpakrepo site/repo-public-key.gpg site/SHA256SUMS --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "ChatGPT Flatpak $tag (experimental)" --notes-file RELEASE_NOTES.md site/ChatGPT.flatpakref site/ChatGPT.flatpakrepo site/repo-public-key.gpg site/SHA256SUMS
          fi
      - name: Remove signing key from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
