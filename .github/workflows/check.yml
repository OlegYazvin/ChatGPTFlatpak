name: Packaging checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q packaging scripts tests
      - run: sh -n packaging/chatgpt scripts/flatpak.sh scripts/build.sh scripts/sign.sh
